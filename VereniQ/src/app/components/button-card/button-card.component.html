<ion-card>
  <ion-card-content>
    <ion-grid>
      <ion-row>
        <ion-col size="2"><ion-icon [name]="iconName" size="large"></ion-icon></ion-col>
        <ion-col class="text">
          <ion-text>
            <h1>
              <ng-content></ng-content>
            </h1>
          </ion-text>
        </ion-col>
        @if (showChevron) {
          <ion-col size="1"><ion-icon name="chevron-forward" size="large"></ion-icon></ion-col>
        }
      </ion-row>
    </ion-grid>
  </ion-card-content>
</ion-card>
