<div class="animation-wrapper">
  <div class="animation-container" *ngIf="visible" [class.fading]="isFading">
    <div class="phone">
      <div class="screen">
        <div class="email-notification"></div>
        <div class="email-open">
          <mat-icon class="mail-icon">email</mat-icon>
        </div>
        <div class="link-clicked"></div>
        <div class="check-bg"></div>
        <div class="checkmark"><mat-icon>check</mat-icon></div>
      </div>
    </div>
  </div>
</div>
