<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>New Account</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding"  [fullscreen]="true">
  <app-container>
    <ion-header collapse="condense">
      <ion-toolbar>
        <ion-title size="large">New Account</ion-title>
      </ion-toolbar>
    </ion-header>
    <form [formGroup]="signUpForm" (ngSubmit)="submitForm()">
      <ion-list>
        <ion-item>
          <ion-label position="floating">Email</ion-label>
          <ion-input type="email" formControlName="email"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="floating">Password</ion-label>
          <ion-input type="password" formControlName="password"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="floating">Confirm Password</ion-label>
          <ion-input type="password" formControlName="confirmPassword"></ion-input>
        </ion-item>
      </ion-list>
      <div class="container-button">
        <ion-button expand="block" type="submit" [disabled]="signUpForm.invalid || loading">
          @if (loading) {
            <ion-spinner name="crescent"></ion-spinner>
          } @else {
            Create Account
          }
        </ion-button>
      </div>
    </form>
  </app-container>
  <ion-toast [isOpen]="message != null" [message]="message!" [duration]="5000" (ionToastWillDismiss)="message = null"></ion-toast>
</ion-content>
