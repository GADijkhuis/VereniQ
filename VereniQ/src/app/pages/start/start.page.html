<ion-content class="ion-padding" [fullscreen]="true">
  <app-container>
    <div id="container-top">
      <img src="../../../assets/icon/favicon.png" alt="VereniQ logo" id="app-icon-logo">
    </div>
    <div id="container-bottom">
      <div id="container-text">
        <h1><b>Smart clubs,<br>smart connection</b></h1>
        <p>Sign in or create an account</p>
      </div>
      <div id="container-button">
        <ion-button expand="block">Sign in</ion-button>
        <ion-button expand="block" fill="outline">Create new account</ion-button>
      </div>
    </div>
  </app-container>
</ion-content>
